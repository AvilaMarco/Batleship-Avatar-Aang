spring.jackson.serialization.INDENT_OUTPUT=true
spring.jackson.date-format="dd-MM-yyyy HH:mm:ss"
spring.jackson.property-naming-strategy=SNAKE_CASE
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/javascript,application/javascript, application/x-javascript
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
# ----------------------------------------|          DOCS          |-------------------------------------------------- #
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# ----------------------------------------|  Base de datos  |----------------------------------------------------------- #
# Conexión por SPRING_DATASOURCE_URL/USERNAME/PASSWORD; el esquema lo crea Flyway y Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.open-in-view=true
server.port=${PORT:4703}
spring.application.name=The Last Shipbender
#logging.level.web=DEBUG
# ----------------------------------------|  Perfiles y JWT  |---------------------------------------------------------- #
spring.profiles.default=dev
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
