<svg xmlns="http://www.w3.org/2000/svg">
<!-- Shipbender · sprite. Barcos (vista cenital, proa a la derecha, 40 unidades por casilla),
     salvos por nación y emblemas. Color de nación: variables acc (principal) y acc2 (clara), definidas como custom properties. -->
<defs>
  <!-- glifos de nación, caja 40x40, trazo = currentColor -->
  <g id="g-water" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13c4-4 6 4 12 0s8 4 12 0M8 21c4-4 6 4 12 0s8 4 12 0M8 29c4-4 6 4 12 0s8 4 12 0"/></g>
  <g id="g-earth" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"><path d="M20 6 34 20 20 34 6 20Z"/><path d="M15 15h10v10H15Z"/></g>
  <g id="g-fire" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"><path d="M21 5c1 7 11 10 11 19a12 12 0 0 1-24 0c0-5 3-8 6-10 0 4 2 6 4 6 1-5 1-10 3-15Z"/></g>
  <g id="g-air" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M20 20a2.5 2.5 0 1 1 2.5 2.5 6 6 0 1 1-6-6 10 10 0 1 1 10 10 14 14 0 0 1-14-14"/></g>
  <g id="g-lotus" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6c5 5 5 13 0 20-5-7-5-15 0-20Z"/><path d="M7 14c7 0 13 5 13 12-7 0-13-5-13-12Z"/><path d="M33 14c-7 0-13 5-13 12 7 0 13-5 13-12Z"/><path d="M9 32h22"/></g>
</defs>

<!-- ===== BARCOS (flota 5-4-3-3-2) ===== -->
<symbol id="carrier" viewBox="0 0 200 40" overflow="visible">
  <g stroke="#2a2112" stroke-width="2.5" stroke-linejoin="round">
    <path d="M6 20C6 9 14 6 24 6H160c22 0 36 7 36 14s-14 14-36 14H24C14 34 6 31 6 20Z" fill="#9a6a38"/>
    <path d="M16 12H160c15 0 26 4 28 8-2 4-13 8-28 8H16Z" fill="#d2ad6e" stroke-width="1.5"/>
    <rect x="46" y="2" width="14" height="36" rx="7" fill="var(--acc,#2b7a9b)"/>
    <rect x="100" y="2" width="14" height="36" rx="7" fill="var(--acc,#2b7a9b)"/>
    <circle cx="156" cy="20" r="6" fill="var(--acc2,#82d0e6)"/>
  </g>
</symbol>
<symbol id="battleship" viewBox="0 0 160 40" overflow="visible">
  <g stroke="#2a2112" stroke-width="2.5" stroke-linejoin="round">
    <path d="M6 20C6 9 14 6 24 6H112c28 0 44 8 44 14s-16 14-44 14H24C14 34 6 31 6 20Z" fill="#9a6a38"/>
    <path d="M16 12H112c16 0 30 4 32 8-2 4-16 8-32 8H16Z" fill="#d2ad6e" stroke-width="1.5"/>
    <rect x="18" y="16" width="18" height="8" rx="2" fill="var(--acc,#2b7a9b)"/>
    <circle cx="52" cy="20" r="7" fill="#3a3a3a"/><circle cx="80" cy="20" r="7" fill="#3a3a3a"/>
    <rect x="100" y="14" width="30" height="4.5" rx="2" fill="#555"/><rect x="100" y="21.5" width="30" height="4.5" rx="2" fill="#555"/>
    <circle cx="96" cy="20" r="3" fill="var(--acc2,#82d0e6)"/>
  </g>
</symbol>
<symbol id="cruiser" viewBox="0 0 120 40" overflow="visible">
  <g stroke="#2a2112" stroke-width="2.5" stroke-linejoin="round">
    <path d="M6 20C6 9 14 6 24 6H76c24 0 40 8 40 14s-16 14-40 14H24C14 34 6 31 6 20Z" fill="#9a6a38"/>
    <path d="M16 12H76c14 0 26 4 28 8-2 4-14 8-28 8H16Z" fill="#d2ad6e" stroke-width="1.5"/>
    <rect x="30" y="3" width="13" height="34" rx="6.5" fill="var(--acc,#2b7a9b)"/>
    <circle cx="62" cy="20" r="6" fill="#3a3a3a"/>
    <rect x="76" y="17.5" width="24" height="5" rx="2" fill="#555"/>
  </g>
</symbol>
<symbol id="submarine" viewBox="0 0 120 40" overflow="visible">
  <g stroke="#2a2112" stroke-width="2.5" stroke-linejoin="round">
    <path d="M6 20a14 14 0 0 1 14-14h80a14 14 0 0 1 14 14 14 14 0 0 1-14 14H20A14 14 0 0 1 6 20Z" fill="#4b5d63"/>
    <path d="M18 20h84" stroke="#2a2112" stroke-width="1.5" fill="none"/>
    <circle cx="48" cy="20" r="7" fill="var(--acc,#2b7a9b)"/>
    <rect x="68" y="16" width="16" height="8" rx="3" fill="#6f8288" stroke-width="1.5"/>
    <circle cx="98" cy="20" r="3" fill="var(--acc2,#82d0e6)" stroke-width="1.5"/>
  </g>
</symbol>
<symbol id="patrol" viewBox="0 0 80 40" overflow="visible">
  <g stroke="#2a2112" stroke-width="2.5" stroke-linejoin="round">
    <path d="M5 20C5 11 11 8 18 8H44c18 0 31 6 31 12s-13 12-31 12H18C11 32 5 29 5 20Z" fill="#9a6a38"/>
    <path d="M14 14H44c10 0 18 3 20 6-2 3-10 6-20 6H14Z" fill="#d2ad6e" stroke-width="1.5"/>
    <rect x="30" y="4" width="11" height="32" rx="5.5" fill="var(--acc,#2b7a9b)"/>
  </g>
</symbol>

<!-- ===== SALVOS: impacto por nación (caja 40) ===== -->
<symbol id="hit-water" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#2b7a9b" stroke="#2a2112" stroke-width="2.5"/><use href="#g-water" color="#e3f3f8" transform="translate(6 6) scale(.7)"/></symbol>
<symbol id="hit-earth" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#3f7a2a" stroke="#2a2112" stroke-width="2.5"/><use href="#g-earth" color="#e4efd3" transform="translate(6 6) scale(.7)"/></symbol>
<symbol id="hit-fire" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#c4361f" stroke="#2a2112" stroke-width="2.5"/><use href="#g-fire" color="#ffe1a8" transform="translate(6 6) scale(.7)"/></symbol>
<symbol id="hit-air" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#d9a21b" stroke="#2a2112" stroke-width="2.5"/><use href="#g-air" color="#fff7dd" transform="translate(6 6) scale(.7)"/></symbol>
<symbol id="hit-lotus" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#f3efe2" stroke="#2a2112" stroke-width="2.5"/><use href="#g-lotus" color="#8a6a1f" transform="translate(6 6) scale(.7)"/></symbol>
<!-- fallo: onda en el color de la nación; objetivo marcado; barco hundido -->
<symbol id="miss" viewBox="0 0 40 40"><g fill="none" stroke="var(--acc,#2b7a9b)" stroke-width="3" stroke-linecap="round"><circle cx="20" cy="20" r="5"/><circle cx="20" cy="20" r="11" stroke-opacity=".6"/></g></symbol>
<symbol id="target" viewBox="0 0 40 40"><g fill="none" stroke="#f9d672" stroke-width="3" stroke-linecap="round"><circle cx="20" cy="20" r="13" stroke-dasharray="6 5" stroke="#2a2112" stroke-width="6"/><circle cx="20" cy="20" r="13" stroke-dasharray="6 5"/><path d="M20 4v8M20 28v8M4 20h8M28 20h8" stroke="#2a2112" stroke-width="6"/><path d="M20 4v8M20 28v8M4 20h8M28 20h8"/></g></symbol>
<symbol id="sunk" viewBox="0 0 40 40"><path d="M9 9l22 22M31 9 9 31" stroke="#2a2112" stroke-width="9" stroke-linecap="round"/><path d="M9 9l22 22M31 9 9 31" stroke="#e8dcb5" stroke-width="4" stroke-linecap="round"/></symbol>

<!-- ===== EMBLEMAS DE NACIÓN (ficha de jugador), caja 48 ===== -->
<symbol id="emb-water" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#e3f3f8" stroke="#2a2112" stroke-width="3"/><use href="#g-water" color="#1e3360" transform="translate(5 5) scale(.95)"/></symbol>
<symbol id="emb-earth" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#e4efd3" stroke="#2a2112" stroke-width="3"/><use href="#g-earth" color="#2a3d17" transform="translate(5 5) scale(.95)"/></symbol>
<symbol id="emb-fire" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#f8e1d3" stroke="#2a2112" stroke-width="3"/><use href="#g-fire" color="#6e2410" transform="translate(5 5) scale(.95)"/></symbol>
<symbol id="emb-air" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#fbf1cf" stroke="#2a2112" stroke-width="3"/><use href="#g-air" color="#5e3a0e" transform="translate(5 5) scale(.95)"/></symbol>
<symbol id="emb-lotus" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#faf6e8" stroke="#2a2112" stroke-width="3"/><use href="#g-lotus" color="#8a6a1f" transform="translate(5 5) scale(.95)"/></symbol>
</svg>
